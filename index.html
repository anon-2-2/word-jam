<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="The crossover of a word game and an escape puzzle.">
        <title>Word Jam</title>
        <link rel="stylesheet" href="./style.css">
        <script type="module" src="./script.js" defer></script>
    </head>
    <body>
        <main>
            <div id="adspace" style="display: flex; justify-content: center">
                <button class="adspace" style="top:0">CLICK ME I'M AN AD!</button>
            </div>
            <section id="gamearea">
                <div id="wipspace">
                    <span id="wiptext">
                        <h1>
                            W O R D J A M
                        </h1>
                    </span>
                    <button id="infobutton">
                        <h1 style="text-align: center; width: 100%">
                            ?
                        </h1>
                    </button>
                </div>
                <div id="gamespace"></div>
                <div id="scorespace">
                    <span id="movesdisplay">
                        <h1 style="text-align: left; width: 100%">
                            10 moves
                        </h1>
                    </span>
                    <span id="scoredisplay">
                        <h1 style="text-align: right; width: 100%">
                            score 25
                        </h1>
                    </span>
                </div>
            </section>
            <div id="adspace" style="display: flex; justify-content: center">
                <button class="adspace" style="bottom:0">CLICK ME I'M AN AD!</button>
            </div>
        </main>
    </body>
</html>
